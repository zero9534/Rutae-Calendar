    function initSwipeNavigation() {
      let startX = 0;
      let startY = 0;
      let isDragging = false;
      let isCalDragging = false;
      let calStartX = 0;
      let calStartY = 0;

      const detailView = document.getElementById('detailView');
      const calView = document.getElementById('calendarView');

      document.addEventListener('touchstart', (e) => {
        if (!detailView.classList.contains('active')) return;
        if (e.target.closest('#detailMainFlow') || e.target.closest('#categorySidePanel') || e.target.closest('header')) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (!detailView.classList.contains('active')) return;
        if (e.target.closest('#detailMainFlow') || e.target.closest('#categorySidePanel') || e.target.closest('header')) return;
        const diffX = e.changedTouches[0].clientX - startX;
        const diffY = e.changedTouches[0].clientY - startY;
        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
          shiftDay(diffX < 0 ? 1 : -1);
        }
      }, { passive: true });

      document.addEventListener('mousedown', (e) => {
        if (!detailView.classList.contains('active')) return;
        if (e.target.closest('#detailMainFlow') || e.target.closest('#categorySidePanel') || e.target.closest('header')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
      });

      window.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        if (!detailView.classList.contains('active')) return;
        const diffX = e.clientX - startX;
        const diffY = e.clientY - startY;
        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
          shiftDay(diffX < 0 ? 1 : -1);
        }
      });

      document.addEventListener('touchstart', (e) => {
        if (!calView.classList.contains('active')) return;
        if (['INPUT', 'BUTTON'].includes(e.target.tagName) || e.target.closest('header')) return;
        calStartX = e.touches[0].clientX;
        calStartY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (!calView.classList.contains('active')) return;
        if (['INPUT', 'BUTTON'].includes(e.target.tagName) || e.target.closest('header')) return;
        const diffX = e.changedTouches[0].clientX - calStartX;
        const diffY = e.changedTouches[0].clientY - calStartY;
        if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
          shiftMonth(diffX < 0 ? 1 : -1);
        }
      }, { passive: true });

      document.addEventListener('mousedown', (e) => {
        if (!calView.classList.contains('active')) return;
        if (['INPUT', 'BUTTON', 'A'].includes(e.target.tagName) || e.target.closest('header')) return;
        isCalDragging = true;
        calStartX = e.clientX;
        calStartY = e.clientY;
      });

      window.addEventListener('mouseup', (e) => {
        if (!isCalDragging) return;
        isCalDragging = false;
        if (!calView.classList.contains('active')) return;
        const diffX = e.clientX - calStartX;
        const diffY = e.clientY - calStartY;
        if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
          shiftMonth(diffX < 0 ? 1 : -1);
        }
      });

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (detailView.classList.contains('active')) {
          if (e.key === 'ArrowLeft') shiftDay(-1);
          if (e.key === 'ArrowRight') shiftDay(1);
        } else if (calView.classList.contains('active')) {
          if (e.key === 'ArrowLeft') shiftMonth(-1);
          if (e.key === 'ArrowRight') shiftMonth(1);
        }
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
